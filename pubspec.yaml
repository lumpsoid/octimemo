name: octimemo
description: handy memos
version: 0.5.1+1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  get_it: ^8.0.3

  sqflite: ^2.4.1
  fast_immutable_collections: ^11.0.0
  rxdart: ^0.28.0
  equatable: ^2.0.7
  note_sqflite_api:
    path: ./packages/note_sqflite_api
  notes_repository:
    path: ./packages/notes_repository
  file_picker: ^8.1.7
  logging: ^1.3.0

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
